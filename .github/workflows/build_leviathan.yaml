name: Build Leviathan firmware

on:
  push:
    branches: ['**']
    paths:
      - 'keyboards/bastardkb/charybdis/3x5/keymaps/leviathan/**'
      - 'modules/bastardkb'
      - 'modules/bastardkb/**'
      - 'qmk.json'
      - '.gitmodules'
      - '.github/workflows/build_leviathan.yaml'
      - '.github/workflows/publish_leviathan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 'Build Leviathan'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: bastardkb/bastardkb-qmk
      qmk_ref: main
      preparation_command: git config --global --add safe.directory "$GITHUB_WORKSPACE"

  publish:
    name: 'Publish Leviathan'
    uses: ./.github/workflows/publish_leviathan.yml
    if: needs.build.result == 'success'
    needs: build
