name: Update Submodule

on:
  repository_dispatch:
    types: [submodule-updated]

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout userspace repo along with submodules
      - name: Checkout userspace repo
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Update the submodule reference and commit
      - name: Update Submodule Reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # BastardKB stays pinned to the standalone pointing API used by Charybdis.
          git submodule update --remote --merge modules/holykeebs
          
          # Commit and push if an update was made
          if ! git diff --quiet; then
            git add .
            git commit -m "chore: update submodule reference to latest"
            git push origin main
          else
            echo "Submodule is already up to date!"
          fi