name: Publish Leviathan firmware

on:
  workflow_call:
    inputs:
      release_name:
        description: "allow setting the release name"
        default: "latest"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Publish Leviathan
    runs-on: ubuntu-latest
    concurrency:
      group: leviathan-firmware-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: Firmware

      - name: Get next version
        id: next
        shell: bash
        run: |
          previous_tag=$(git tag --list 'r*' --sort=-version:refname | awk '/^r[0-9]+$/ { if (!found) print; found=1 }')
          if [ -z "$previous_tag" ]; then
            echo "::notice::No numbered release tags found; starting at r1."
            version=1
          else
            previous_version=${previous_tag#r}
            version=$((10#$previous_version + 1))
          fi
          printf 'version=%s\nr_version=r%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

      - name: Generate Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: Leviathan firmware release ${{ steps.next.outputs.version }}
          tag_name: ${{ steps.next.outputs.r_version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          files: |
            **/*.hex
            **/*.bin
            **/*.uf2
